name: Auth Service CI

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'services/auth-service/**'
      - '.github/workflows/auth-service-ci.yml'

  push:
    branches:
      - develop
      - main
    paths:
      - 'services/auth-service/**'
      - '.github/workflows/auth-service-ci.yml'

jobs:
  auth-service-ci:
    name: Validate auth-service
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/auth-service

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: auth_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d auth_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      NODE_ENV: test
      AUTH_SERVICE_PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/auth_db
      JWT_SECRET: test_secret
      JWT_EXPIRES_IN: 1d

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/auth-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run database migrations
        run: |
          if [ -d "prisma/migrations" ]; then
            npx prisma migrate deploy
          else
            echo "No Prisma migrations found. Skipping migrate deploy."
          fi

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

  auth-service-docker:
    name: Validate auth-service Docker build
    runs-on: ubuntu-latest

    needs:
      - auth-service-ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t auth-service:test ./services/auth-service